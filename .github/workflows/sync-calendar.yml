name: Sync Fastmail calendar from email

on:
  schedule:
    # Every 15 minutes. Fine on a public repo (unlimited Actions minutes). On a
    # private repo this is ~2,900 runs a month, over the free plan's 2,000
    # minutes, so change it to hourly: "0 * * * *".
    # GitHub may delay runs under load; that's fine here.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install icalendar caldav

      - name: Run sync
        env:
          FASTMAIL_EMAIL: ${{ secrets.FASTMAIL_EMAIL }}
          FASTMAIL_APP_PASSWORD: ${{ secrets.FASTMAIL_APP_PASSWORD }}
          # Optional overrides — uncomment and edit as needed:
          # IMAP_SUBJECT_FILTER: "WorkCalendar"
          # CALENDAR_NAME: "Work"
          # DELETE_PROCESSED_EMAILS: "false"   # keep synced emails in the Inbox
        run: python sync_calendar.py
